app-id: org.freedesktop.Sdk.Extension.ldc
branch: '24.08'
runtime: org.freedesktop.Sdk
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
build-extension: true
separate-locales: false
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm18
build-options:
  prefix: /usr/lib/sdk/ldc
  prepend-path: /usr/lib/sdk/llvm18/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm18/lib
cleanup:
  - /bootstrap
modules:

  - name: ldc-bootstrap
    buildsystem: simple
    build-commands:
      - mkdir -p /usr/lib/sdk/ldc/bootstrap
      - cp -av * /usr/lib/sdk/ldc/bootstrap/
    cleanup:
      - '*'
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/ldc-developers/ldc/releases/download/v1.42.0/ldc2-1.42.0-linux-x86_64.tar.xz
        sha256: a7bc9c956138f558cadf9c962352f59d41c80df6eb3ae3f8039f25be14a69303
        x-checker-data:
          type: json
          url: https://api.github.com/repos/ldc-developers/ldc/releases/latest
          version-query: .tag_name | sub("^[vV]"; "")
          url-query: >-
            .assets | map(select(.name=="ldc2-\($version)-linux-x86_64.tar.xz")) |
            first | .browser_download_url

      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/ldc-developers/ldc/releases/download/v1.42.0/ldc2-1.42.0-linux-aarch64.tar.xz
        sha256: 687707c3e20ff910528eb2d92f27a98cb0960284de3b026e6bf20284ac1c8511
        x-checker-data:
          type: json
          url: https://api.github.com/repos/ldc-developers/ldc/releases/latest
          version-query: .tag_name | sub("^[vV]"; "")
          url-query: >-
            .assets | map(select(.name=="ldc2-\($version)-linux-aarch64.tar.xz"))
            | first | .browser_download_url

  - name: ldc-cycle
    build-options:
      prefix: /usr/lib/sdk/ldc/cycle
      append-path: /usr/lib/sdk/ldc/bootstrap/bin
    buildsystem: cmake-ninja
    config-opts: &ldc_config_opts
      - -DLDC_WITH_LLD:BOOL=OFF
    sources:
      - &ldc-source
        type: archive
        url: https://github.com/ldc-developers/ldc/releases/download/v1.42.0/ldc-1.42.0-src.tar.gz
        sha256: 9bb0f628f869f7fc7b53c381a79742d29c17552c6f1a56b0a02aa289e65a0e3b
        x-checker-data:
          type: json
          url: https://api.github.com/repos/ldc-developers/ldc/releases/latest
          tag-query: .tag_name
          version-query: $tag | sub("^[vV]"; "")
          url-query: >-
            .assets | map(select(.name=="ldc-\($version)-src.tar.gz")) | first | .browser_download_url
          is-main-source: true
    cleanup:
      - '*'

  - name: ldc
    build-options:
      prepend-path: /usr/lib/sdk/ldc/cycle/bin
    buildsystem: cmake-ninja
    config-opts: *ldc_config_opts
    sources:
      - *ldc-source

  - name: dtools
    buildsystem: simple
    build-options:
      prepend-path: /usr/lib/sdk/ldc/bin
    build-commands:
      - ldmd2 -O -release ddemangle.d -ofddemangle
      - ldmd2 -O -release DustMite/dustmite.d DustMite/splitter.d DustMite/polyhash.d
        -ofdustmite
      - ldmd2 -O -release rdmd.d -ofrdmd
      - install -Dsm0755 ddemangle dustmite rdmd /usr/lib/sdk/ldc/bin/
    sources:
      - type: git
        url: https://github.com/dlang/tools.git
        tag: v2.112.0
        commit: 92f20b80a32f5cc30227c8c1944c7fb29231e0e7
        x-checker-data:
          type: git
          tag-pattern: ^v([\d\.]+)$

  - name: dub
    buildsystem: simple
    build-options:
      prepend-path: /usr/lib/sdk/ldc/bin
    build-commands:
      - DMD=ldmd2 ./build.d
      - install -s bin/dub /usr/lib/sdk/ldc/bin/
    sources:
      - type: git
        url: https://github.com/dlang/dub.git
        tag: v1.40.0
        commit: ac94c79cbe16c5e2cfec1ad9129c15d75f0dc6fc
        x-checker-data:
          type: json
          url: https://api.github.com/repos/dlang/dub/releases/latest
          tag-query: .tag_name
          version-query: $tag | sub("^[vV]"; "")

  - name: scripts
    buildsystem: simple
    build-commands:
      - cp {install,enable}.sh /usr/lib/sdk/ldc
    sources:
      - type: script
        commands:
          - export PATH="$PATH:/usr/lib/sdk/ldc/bin"
          - export LIBRARY_PATH="$LIBRARY_PATH:/usr/lib/sdk/ldc/lib"
          - export LD_LIBRARY_PATH="$LD_LIBRARY_PATH:/usr/lib/sdk/ldc/lib"
        dest-filename: enable.sh
      - type: script
        commands:
          - mkdir -p ${FLATPAK_DEST}/lib
          - cp -r /usr/lib/sdk/ldc/lib/lib{druntime,phobos2}-ldc-shared.so* /usr/lib/sdk/ldc/lib/libldc-jit.so*
            ${FLATPAK_DEST}/lib/
        dest-filename: install.sh

  - name: appdata
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/share/metainfo
      - cp ${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.ldc.metainfo.xml
